apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bank-database-pvc
  namespace: bank-lab # Nằm trong namespace của dự án bank-lab
spec:
  accessModes:
    - ReadWriteOnce # Chỉ cho phép 1 Pod mount ổ cứng này ở một thời điểm
  storageClassName: bank-fast-storage # Trỏ chính xác đến StorageClass vừa tạo ở trên
  resources:
    requests:
      storage: 10Gi # Yêu cầu cấp phát 10GB dung lượng