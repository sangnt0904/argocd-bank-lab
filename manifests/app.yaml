apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-leak-detector
  labels:
    app: data-leak-detector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: data-leak-detector
  template:
    metadata:
      labels:
        app: data-leak-detector
    spec:
      containers:
      - name: python-scanner
        image: leak-detector-app:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: data-leak-detector-svc
  labels:
    app: data-leak-detector
spec:
  ports:
  - port: 8080
    targetPort: 8080
    name: http
  selector:
    app: data-leak-detector
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: data-leak-detector-route
  labels:
    app: data-leak-detector
spec:
  to:
    kind: Service
    name: data-leak-detector-svc
  port:
    targetPort: http