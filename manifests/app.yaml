apiVersion: apps/v1
kind: Deployment
metadata:
  name: bank-account-service
  labels:
    app: bank-account-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bank-account-service
  template:
    metadata:
      labels:
        app: bank-account-service
    spec:
      containers:
      - name: account-service
        image: image-registry.openshift-image-registry.svc:5000/bank-lab/account-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: bank-account-svc
  labels:
    app: bank-account-service
spec:
  ports:
  - port: 8080
    targetPort: 8080
    name: http
  selector:
    app: bank-account-service
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: bank-account-route
  labels:
    app: bank-account-service
spec:
  to:
    kind: Service
    name: bank-account-svc
  port:
    targetPort: http