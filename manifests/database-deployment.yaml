apiVersion: apps/v1
kind: Deployment
metadata:
  name: bank-database
  namespace: bank-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bank-database
  template:
    metadata:
      labels:
        app: bank-database
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        env:
        - name: POSTGRES_DB
          value: bank_db
        - name: POSTGRES_USER
          value: postgres
        - name: POSTGRES_PASSWORD
          value: secretpassword
        ports:
        - containerPort: 5432
          name: postgres
        volumeMounts:
        - mountPath: /var/lib/postgresql/data
          name: db-storage
      volumes:
      - name: db-storage
        persistentVolumeClaim:
          claimName: bank-database-pvc