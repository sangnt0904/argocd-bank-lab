apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: account-service-build
  namespace: bank-lab
  labels:
    app: bank-account-service
spec:
  source:
    type: Git
    git:
      uri: https://github.com/sangnt0904/bank-account-code.git
      ref: main
  strategy:
    type: Source
    sourceStrategy:
      from:
        kind: ImageStreamTag
        name: 'python:3.9-ubi8'
        namespace: openshift
  output:
    to:
      kind: ImageStreamTag
      name: 'account-service:v1.0.1'
  triggers:
    - type: ConfigChange
  successfulBuildsHistoryLimit: 3
  failedBuildsHistoryLimit: 3