apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: leak-detector-app
  namespace: bank-lab
  labels:
    app: data-leak-detector
spec:
  lookupPolicy:
    local: true # Cho phép Deployment gọi thẳng tên 'leak-detector-app:latest'
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: leak-detector-build
  namespace: bank-lab
  labels:
    app: data-leak-detector
spec:
  # 1. Nguồn kéo mã nguồn ứng dụng
  source:
    type: Git
    git:
      uri: https://github.com/sangnt0904/bank-leak-detector-code.git
      ref: main

  # 2. Chiến lược đóng gói S2I (Source-to-Image) với Python chuẩn UBI8 của Red Hat
  strategy:
    type: Source
    sourceStrategy:
      from:
        kind: ImageStreamTag
        name: 'python:3.9-ubi8'
        namespace: openshift

  # 3. Nơi lưu trữ image sau khi build thành công
  output:
    to:
      kind: ImageStreamTag
      name: 'leak-detector-app:latest'

  # 4. Cơ chế tự động kích hoạt lượt build
  triggers:
    - type: ConfigChange # Tự build ngay khi file BuildConfig này được áp dụng hoặc sửa đổi
    - type: ImageChange  # Tự build lại khi Red Hat cập nhật bản vá bảo mật cho image python:3.9-ubi8

  # 5. Giới hạn số lượng bản ghi lịch sử build để tiết kiệm dung lượng cụm
  successfulBuildsHistoryLimit: 3
  failedBuildsHistoryLimit: 3